name: bible_riddle
publish_to: 'none'
description: Peaceful minimalist Bible riddle game - Phase B data layer.
version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.5
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/manifest.json
    - assets/data/riddles_phase_a.json
