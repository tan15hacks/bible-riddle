name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Validate content
        run: python tool/validate_content.py assets/data
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
