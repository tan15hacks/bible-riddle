name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Validate content
        run: python tool/validate_content.py assets/data
      - name: Analyze
        run: |
          flutter analyze > analyze.log 2>&1 || {
            cat analyze.log
            exit 1
          }
      - name: Upload analyzer log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: analyze.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Test
        run: flutter test
